services:
  analytics:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_OLLAMA_URL: ${VITE_OLLAMA_URL}
        VITE_OLLAMA_MODEL: ${VITE_OLLAMA_MODEL:-qwen2.5:14b}
    ports:
      # host → container. App reachable at http://localhost:${PORT}
      # The Cloudflare tunnel points the subdomain → http://localhost:8090
      - "${PORT:-8090}:80"
    restart: unless-stopped
